version: '3.8'

# ¿Por qué necesitamos dos servicios?
# Zookeeper: coordina y monitorea el estado del cluster Kafka
#            (en versiones modernas de Kafka ya no es necesario, pero
#             en la versión que usamos aún se requiere como dependencia)
# Kafka:     el broker que recibe, almacena y distribuye los eventos

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: streamsocial-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: streamsocial-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      # LISTENERS: cómo Kafka escucha internamente (dentro de Docker)
      # ADVERTISED_LISTENERS: cómo los clientes externos (nuestro Python) se conectan
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      # Factor de replicación en 1 porque solo tenemos 1 broker (suficiente para desarrollo)
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      # Crear el topic automáticamente si no existe (conveniente en desarrollo)
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 10

  # Kafka UI: interfaz web para ver topics, mensajes y consumers en tiempo real
  # Accede en http://localhost:8080 una vez levantado
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: streamsocial-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: streamsocial
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
